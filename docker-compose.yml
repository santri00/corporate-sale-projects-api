services:
  mongo:
    image: mongo:7
    container_name: corporate-sales-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: corporate-sales-api
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: corporate_sales
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
